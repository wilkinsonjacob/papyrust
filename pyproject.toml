[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "papyrust"
version = "0.1.0a1"
description = "Rust-style Python, with full static typing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Wilkinson" }]
keywords = ["rust", "error-handling", "monad", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wilkinsonjacob/papyrust"
Repository = "https://github.com/wilkinsonjacob/papyrust"
Issues = "https://github.com/wilkinsonjacob/papyrust/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ty.environment]
root = ["./src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
